[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplens-core"
version = "2.5.6"
description = "DeepLens is a differentiable optical lens simulator for computational imaging and optical design."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Xinge Yang", email = "xinge.yang@kaust.edu.sa"}
]
requires-python = ">=3.12,<3.13"
keywords = [
    "optics",
    "lens design",
    "differentiable rendering",
    "computational photography",
    "computational imaging",
    "ray tracing",
    "pytorch",
    "optical simulation",
    "PSF",
    "diffractive optics",
    "end-to-end optimization",
    "differentiable optics",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.10",
    "torchvision>=0.25",
    "opencv-python>=4.8.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.20.0",
    "lpips>=0.1.4",
    "einops>=0.7.0",

    "tqdm>=4.65.0",

]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipywidgets>=8.0.0",
    # Needed by the config-driven scripts (scripts/1_design_hybridlens.py,
    # scripts/2_autolens_rms.py) and to regenerate
    # material/refractiveindex_data.json; not a library runtime dependency.
    "pyyaml>=6.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/vccimaging/DeepLens"
Repository = "https://github.com/vccimaging/DeepLens"
Documentation = "https://ai4optics.com/deeplens/"
Issues = "https://github.com/vccimaging/DeepLens/issues"
Changelog = "https://github.com/vccimaging/DeepLens/releases"

[tool.setuptools.package-data]
deeplens = ["material/*.AGF", "material/*.json"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Can't initialize NVML:UserWarning",
    "ignore:Can't get nvml device count:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deeplens*"]

[tool.ruff]
required-version = "==0.16.5"
target-version = "py312"
line-length = 88
indent-width = 4
include = ["*.py", "*.pyi", "pyproject.toml"]
preview = false
respect-gitignore = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
select = ["E9", "F63", "F7", "I"]
